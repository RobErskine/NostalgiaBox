# =============================================================================
# TimewarpTV configuration
# =============================================================================
# Copy this file to `config.yaml` (or /etc/nostalgiabox/config.yaml) and edit it
# to match the show folders on your SD card. Validate it any time with:
#
#     nostalgiabox --check
#
# There are two ways to define channels. Pick ONE.

# -----------------------------------------------------------------------------
# OPTION A (easiest): auto-discover channels from a media folder.
# -----------------------------------------------------------------------------
# Point `media_root` at a folder; every sub-folder becomes a channel, named
# after the folder and numbered sequentially. Just drop show folders in and go:
#
#   /media/nostalgiabox/
#     ├── Dragon Tales/          -> channel 2 "Dragon Tales"
#     ├── Arthur/                -> channel 3 "Arthur"
#     └── Winnie the Pooh/       -> channel 4 "Winnie The Pooh"
#
# media_root: /media/nostalgiabox
# first_channel_number: 2      # what the first discovered channel is numbered

# -----------------------------------------------------------------------------
# OPTION B (explicit): list channels yourself for full control of numbers/names.
# -----------------------------------------------------------------------------
channels:
  # A "welcome" channel, like the one a hotel TV boots onto: a still card
  # listing what is on every other channel. It is an ordinary channel holding
  # one very boring episode, which you generate from this very config with:
  #
  #   python -m nostalgiabox.guide_gen --config config.yaml \
  #       --out /media/nostalgiabox/01-guide/welcome.mp4
  #
  # Re-run it whenever you add or rename a channel. Pair it with
  # home_channel: 1 above so the remote's HOME button comes back here.
  - number: 1
    name: "Guide"
    path: /media/nostalgiabox/01-guide
    breaks: false       # never interrupt the guide with a break clip
    start_offset: 0     # always from the top; it is a still picture anyway
  - number: 2
    name: "Dragon Tales"
    path: /media/nostalgiabox/dragon-tales
    breaks: false   # no break blocks on this channel, regardless of the global setting
  - number: 3
    name: "Arthur"
    path: /media/nostalgiabox/arthur
    # Leave out episodes you don't want on this channel:
    exclude_seasons: ["6-25"]      # drop seasons 6 through 25 (detected from
                                   #   names like S06E01, "Season 6", 6x01)
    exclude: ["*special*"]         # drop any file/folder whose path matches
  - number: 4
    name: "The Magic School Bus"
    path: /media/nostalgiabox/magic-school-bus
  - number: 5
    name: "Bear in the Big Blue House"
    path: /media/nostalgiabox/bear-in-the-big-blue-house
  - number: 6
    name: "Winnie the Pooh"
    path: /media/nostalgiabox/winnie-the-pooh
  - number: 7
    name: "The Berenstain Bears"
    path: /media/nostalgiabox/berenstain-bears
  - number: 8
    name: "Mister Rogers' Neighborhood"
    path: /media/nostalgiabox/mister-rogers
  - number: 9
    name: "Adult Swim"
    path: /media/nostalgiabox/adult-swim
    # Gate a channel behind a 4-digit-style code (digits only, 1-8 chars) -
    # this is a kid gate, not real security; the code is stored in plain text.
    # It stays unlocked only while you're on it: change channel and it locks
    # again (as does standby/power-off), so coming back asks for the code.
    passcode: "1997"
    locked_message: "ADULT SWIM - LIVE AT 9PM"
  - number: 10
    name: "Movies"
    path: /media/nostalgiabox/movies
    # Per-channel overrides of the global `tune_in` / `start_offset` below -
    # handy for a movie channel: pick up where you left off, and start at 0:00
    # instead of a few seconds in.
    tune_in: resume
    start_offset: 0

# -----------------------------------------------------------------------------
# How a channel behaves when you tune into it.
#   random    - start a fresh random episode (the classic "flip and a show
#               starts"); episodes keep rolling on shuffle after that.  [default]
#   resume    - pick up where you left off on that channel last time.
#   broadcast - the channel runs like a real always-on station: it advances in
#               real time even while you're watching something else, so you tune
#               in partway through whatever "would" be airing. (Needs ffprobe.)
# -----------------------------------------------------------------------------
tune_in: random

start_channel: 2          # which channel the box powers on to
# Burn-in guard: after this many minutes on a STILL screen - the guide card, a
# locked channel's lock screen, an empty channel's colour bars - with nobody
# pressing a button, go to standby (the drifting-logo screensaver). Any press
# restarts the count, and ordinary shows never trigger it. 0 turns it off.
idle_standby_minutes: 10

# Where the remote's HOME button goes. Leave it out and HOME uses start_channel.
# Point both at a "welcome" channel (see the guide channel below) to get the
# hotel-TV behaviour: the box boots onto a card listing what's on, and HOME
# brings a lost viewer straight back to it.
# home_channel: 1

# Where "resume" tune-in positions are saved, so they survive a power cut (not
# just a channel change). Point it at the media drive so it works even if the
# SD card is read-only (see the kid-proofing section of the README).
# state_file: /media/nostalgiabox/.nostalgiabox-state.json

# -----------------------------------------------------------------------------
# Between-episode break blocks: old commercials, or your own bathroom/snack/
# stretch break cards - just video files in a folder. Fires only when an
# episode reaches a natural end, never mid-episode. Turn it off for a specific
# channel with `breaks: false` on that channel (see the baby channel above).
# -----------------------------------------------------------------------------
# breaks:
#   path: /media/nostalgiabox/breaks
#   every: 2        # a break block after every 2 episodes
#   count: [1, 2]   # 1-2 clips per block (a single number is also fine)
# (channel 2 below sets `breaks: false` to opt out even when this is on)

# --- The "feel" of the TV ----------------------------------------------------
# Shows keep their own aspect ratio (4:3 is pillar-boxed, 16:9 fills the screen)
# and get the CRT curve/rounding. Set force_4_3:true to instead letterbox every
# show into a single 4:3 frame.
force_4_3: false

# Start each episode a random number of seconds in, between these two values, so
# channel switches land at varied points in the show (skips the black leader/
# intro too). Use a single number for a fixed offset, e.g. `start_offset: 5`.
start_offset: [6, 10]

# Channel-change effect: "none" (default), "glitch" (brief digital corruption),
# or "static" (analog snow).
transition: none
transition_duration: 0.4  # how long the effect shows (if not "none")

# With transition "none", keep the current show playing this many seconds while
# the next channel loads in the background, then cut over - so the picture never
# freezes on a channel change. 0 = switch immediately.
bridge_seconds: 0.8
channel_bug_seconds: 4    # how long the channel banner lingers
osd_duration: 2           # how long the volume bar / messages linger

# --- On-screen display look (the green digital readouts) ---------------------
ui:
  font: "VT323"           # bundled retro terminal font (installed by install.sh)
  color: "#4DFF5A"        # phosphor green for CH banner, volume bar, messages
  dim_color: "#123B18"    # (reserved) colour for unlit elements
  glow: true              # soft CRT-style glow around the text
  logo: true              # the Time Warp TV mark (assets/logo.svg) in the
                          #   corner of the channel banner and volume bar
  # The guide card's header is the logo + wordmark (assets/wordmark.svg). Set a
  # different name here and it's typed out in the header instead.
  brand: "TIME WARP TV"
  # When you change channel, skip an episode or press Info, caption what's on
  # in the bottom-right: "Batman Beyond / S03 E05 Out of the Past", or a film's
  # title and year. Worked out from the file and folder names - Plex-style names
  # like "Title (1999).mp4" and "Show S01E05 Title.mkv" come out best.
  now_playing: true

# --- CRT picture effect (for 4:3 shows on a flat TV) -------------------------
# Bends the picture like a tube TV: a gentle bulge, rounded corners, a vignette
# and faint scanlines. Set enabled:false if your Pi struggles or you dislike it.
crt:
  enabled: true
  # The effect switches itself OFF for anything taller than max_height and
  # back on afterwards, so a modern HD film is not watched through a tube. 720
  # keeps it for period TV (including 720p kids' shows) and drops it for 1080p
  # features. Set 0 to always keep it on, whatever is playing.
  max_height: 720
  # These are the default, gentle numbers: the tube shape and the scanlines
  # read clearly, but they stay out of the picture's way. For the heavy look,
  # roughly double them (0.12 / 0.065 / 0.25 / 0.12); halve them again for a
  # barely-there hint of a tube.
  curvature: 0.045        # 0 = flat, ~0.2 = strongly bulged
  corner_radius: 0.032    # how rounded the corners are
  vignette: 0.11          # edge darkening (0-1)
  scanlines: true
  scanline_intensity: 0.045

# --- Audio -------------------------------------------------------------------
initial_volume: 70        # 0-100
volume_step: 5            # how much each volume press changes it
# Force audio to a specific output. On a Pi the default can be the 3.5mm jack;
# for a TV you want HDMI. Run `nostalgiabox --list-audio` to see the names.
# audio_device: "alsa/hdmi:CARD=vc4hdmi0,DEV=0"   # HDMI0 (use vc4hdmi1 for HDMI1)

# Pressing volume-down once more when already at 0 cleanly powers off the Pi so
# it's safe to unplug (needs the sudo rule from scripts/install-service.sh).
power_off_on_min_volume: true
# power_off_command: ["sudo", "poweroff"]   # override the shutdown command

# --- Playback ----------------------------------------------------------------
scan_recursive: true      # also look inside season sub-folders for episodes
# video_extensions: [".mp4", ".mkv", ".avi", ".m4v"]   # override if needed
# shuffle_seed: 1234       # set for a repeatable shuffle order (mostly for tests)

# fullscreen: false        # run mpv in a window (handy on a dev machine; use
                           #   `nostalgiabox --windowed` instead of editing this)
# hwdec: "no"              # disable hardware decode - a fallback if playback
                           #   stutters on a weaker GPU (e.g. a Raspberry Pi 3)

# Which player to drive. "auto" (default) uses libmpv on Linux/the Pi, and
# drives the mpv binary over a JSON IPC socket on macOS - where libmpv cannot
# open a window from a plain Python process (you get audio but no picture).
# Force one with "libmpv" or "ipc" if you need to.
# player_backend: auto

# --- Remote control input ----------------------------------------------------
# All backends are auto-detected; anything unavailable is skipped, so these are
# only needed to turn things off or fine-tune device selection.
input:
  keyboard: true          # USB/IR remotes & keyboards (via Linux evdev)
  cec: true               # the TV's own remote over HDMI-CEC (needs cec-utils)
  stdin: false            # developer keyboard over the terminal
  # keyboard_name_filter: "remote"   # only listen to devices whose name matches
  # keyboard_devices: ["/dev/input/event0"]  # or pin exact devices
  # keyboard_grab: false             # true = stop keystrokes leaking to console

  # Map specific keys to actions (handy for odd remotes). Find a button's key
  # name with `sudo evtest`. Actions: channel_up, channel_down, volume_up,
  # volume_down, mute, enter, info, last_channel, home, next_episode,
  # previous_episode, power, quit, digit_0..digit_9, or none (to unbind). Example for a Logitech R400 presenter. NOTE: its
  # play-screen button sends Escape (the quit key!), so remap KEY_ESC too or it
  # will shut the box off.
  # key_overrides:
  #   KEY_PAGEUP: channel_down    # left  (<) arrow
  #   KEY_PAGEDOWN: channel_up    # right (>) arrow
  #   KEY_ESC: volume_down        # play-screen button (sends Esc)
  #   KEY_F5: volume_down         #   ...and sometimes F5 - map both
  #   KEY_DOT: volume_up          # blank-screen button
  #   KEY_B: volume_up            #   ...blank button alt code - map both
